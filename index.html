  <body data-view="hub">
    <!--
      The darkroom. This canvas is a content="drawable" host: the hanging
      prints are its drawable children, drawn into WebGL textures.
    -->
    <canvas id="world" content="drawable" layoutsubtree aria-label="The darkroom: prints hanging on a wire"></canvas>
    <div id="world-layer"></div>
    <main id="ui"></main>
    <noscript>Drawable needs JavaScript to develop its prints.</noscript>
