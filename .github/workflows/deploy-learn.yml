name: Deploy learn

# The Drawable course (the repository root: the darkroom and the field guide) goes live on
# https://ionloft.com/learn-html-in-canvas/ when:
#   - a GitHub release tagged learn-v* is published (`gh release create learn-v0.2.0 --generate-notes`), or
#   - someone runs it by hand: Actions → Deploy learn → Run workflow (`gh workflow run deploy-learn.yml -f ref=<ref>`).
#     Deploying an older tag is the rollback.
# Releases with other tags (kiosk-v* is the Kiosk example) are ignored. Vercel deploys separately.
# The server side (nginx, HTTPS, the deploy user) is managed by Ansible in the vps-contabo repo
# (roles/static_site, app `learn-html-in-canvas`). The deploy key can only upload a release and switch to it.
# It can also be deployed from that repo: make app-deploy APP=learn-html-in-canvas
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag, branch or commit to deploy (an older tag rolls back)
        required: true
        default: main

# one deploy at a time, and never cancel one halfway
concurrency:
  group: deploy-learn
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # only the course's releases, and never a pre-release
    if: >-
      github.event_name != 'release' ||
      (startsWith(github.event.release.tag_name, 'learn-v') && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    environment:
      name: learn
      url: ${{ vars.SITE_URL }}
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      REF: ${{ github.event.release.tag_name || inputs.ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.REF }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # the same build as Vercel (vercel.json) and `make app-deploy` (vps-contabo vars.yml), under the path
      - run: pnpm typecheck && pnpm exec vite build
        env:
          NODE_ENV: production
          BASE_PATH: /learn-html-in-canvas
          SITE_ORIGIN: https://ionloft.com
      - name: Set up the deploy key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          {
            echo "DEPLOY_SSH=ssh -i $HOME/.ssh/deploy -p ${{ vars.DEPLOY_PORT }} -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes"
            echo "DEPLOY_TARGET=deploy@${{ vars.DEPLOY_HOST }}"
            echo "COMMIT=$(git rev-parse HEAD)"
          } >> "$GITHUB_ENV"
      - name: Upload the release
        run: rsync -rlz --delete -e "$DEPLOY_SSH" dist/ "$DEPLOY_TARGET:$COMMIT/"
      - name: Go live
        run: $DEPLOY_SSH "$DEPLOY_TARGET" "activate $COMMIT"
      - name: Check the live site serves this build (rolls back if not)
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsS -H 'Cache-Control: no-cache' "$SITE_URL" | cmp -s - dist/index.html; then
              echo "### Deployed \`$REF\` ($COMMIT) to $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 3
          done
          echo "::error::$SITE_URL does not serve this build, rolling back"
          $DEPLOY_SSH "$DEPLOY_TARGET" rollback
          exit 1
